definitions:
  steps:
    - step: &build-soki
        name: Build Infrastructure Image
        script:
          - export PATH=/usr/bin:${PATH}
          - TAG=$(date +%Y%m%d-%H%M%S)
          - echo ${CR_PASSWORD} | docker login -u "${CR_USER}" --password-stdin ${CR_URL}
          - >-
            docker build 
            -t "${CR_URL}/soki/owui-image:${TAG}" 
            -f ./Dockerfile 
            .
          - docker push "${CR_URL}/soki/owui-image:${TAG}"
        services:
          - docker
        runs-on:
          - self.hosted
          - linux
        size: 8x
  services:
    docker:
      memory: 12288
            

pipelines:
  branches:
    main:
      - step: *build-soki
