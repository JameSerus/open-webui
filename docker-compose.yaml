services:
  soki:
    image: jameserus/owui-mod:latest
    container_name: soki
    volumes:
      - soki:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'CORS_ALLOW_ORIGIN=https://soki.one'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  soki: {}
